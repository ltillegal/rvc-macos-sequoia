name: lock

# Regenerates requirements.lock.txt on the platform the app actually runs on.
# macOS arm64 is required: fairseq, pyworld and gradio ship sdist-only releases
# whose metadata pip only resolves correctly against macOS wheels, so the lock
# cannot be produced on Linux.
#
# Actions -> lock -> Run workflow, then commit the downloaded artifact.

on:
  # Also run whenever the pins change, so the artifact always matches the
  # requirements.txt of the commit that changed it.
  push:
    paths:
      - requirements.txt
      - .github/workflows/lock.yml
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the lockfile is being regenerated"
        required: false
        default: "refresh"

permissions:
  contents: read

jobs:
  freeze:
    name: requirements.lock.txt
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11
        run: brew install python@3.11

      - name: Create the virtual environment
        run: |
          PY="$(brew --prefix)/opt/python@3.11/bin/python3.11"
          "$PY" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          "$PWD/.venv/bin/python" -V

      - name: Install the pinned requirements
        run: |
          python -m pip install --disable-pip-version-check "pip==24.0"
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Freeze
        run: |
          {
            printf '# Generated on macOS arm64 with Python 3.11 by .github/workflows/lock.yml.\n'
            printf '# Regenerate: Actions -> lock -> Run workflow, then commit this file.\n'
            # --all keeps pip, setuptools and wheel: gradio needs pkg_resources at
            # runtime, and a venv from Homebrew python@3.11 does not ship it.
            python -m pip freeze --all
          } > requirements.lock.txt

          # The lock is only useful if it keeps the pins that the app needs.
          grep -qx 'torch==2.4.0' requirements.lock.txt
          grep -qx 'torchvision==0.19.0' requirements.lock.txt
          grep -qx 'torchaudio==2.4.0' requirements.lock.txt
          grep -qx 'local-attention==1.10.0' requirements.lock.txt
          grep -qx 'gradio_client==0.2.10' requirements.lock.txt
          grep -qx 'setuptools==69.5.1' requirements.lock.txt
          grep -qx 'fairseq @ git+https://github.com/One-sixth/fairseq@44800430a728c2216fd1cf1e8daa672f50dfacba' requirements.lock.txt
          python -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
          if grep -q '^gradio_client==[^0]\|^gradio_client==0\.[^2]' requirements.lock.txt; then
            echo "gradio_client must stay on 0.2.x: gradio 3.34 imports media_data from it" >&2
            exit 1
          fi
          if grep -q '^torch-einops-utils==' requirements.lock.txt; then
            echo "torch-einops-utils must not be present: it requires torch>=2.5" >&2
            exit 1
          fi
          cat requirements.lock.txt

      - uses: actions/upload-artifact@v4
        with:
          name: requirements.lock.txt
          path: requirements.lock.txt
          if-no-files-found: error
