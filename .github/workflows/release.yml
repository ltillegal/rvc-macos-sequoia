name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the .dmg to (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Launcher syntax
        run: bash -n packaging/launcher.sh

      - name: Import the Developer ID certificate
        # Optional. Without the secrets the DMG is ad-hoc signed, which works
        # locally but makes Gatekeeper ask the user to right-click -> Open.
        env:
          RVC_CODESIGN_IDENTITY: ${{ secrets.RVC_CODESIGN_IDENTITY }}
          RVC_CODESIGN_P12: ${{ secrets.RVC_CODESIGN_P12 }}
          RVC_CODESIGN_P12_PASSWORD: ${{ secrets.RVC_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$RVC_CODESIGN_IDENTITY" ]; then
            echo "no signing identity configured, building an ad-hoc signed DMG"
            exit 0
          fi
          if [ -z "$RVC_CODESIGN_P12" ]; then
            echo "RVC_CODESIGN_IDENTITY is set but RVC_CODESIGN_P12 is empty" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$RVC_CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$RVC_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build .dmg
        id: build
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RVC_CODESIGN_IDENTITY: ${{ secrets.RVC_CODESIGN_IDENTITY }}
          RVC_NOTARY_PROFILE: ${{ secrets.RVC_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            VERSION="0.0.0"
          else
            VERSION="${REF_NAME#v}"
          fi
          bash packaging/build-dmg.sh --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test the bundle
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          hdiutil verify "dist/RVC-WebUI-$VERSION-macos.dmg" | tail -1
          MP=$(hdiutil attach "dist/RVC-WebUI-$VERSION-macos.dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          trap 'hdiutil detach "$MP" -quiet' EXIT
          test -x "$MP/RVC WebUI.app/Contents/MacOS/RVCWebUI"
          test -f "$MP/RVC WebUI.app/Contents/Resources/app/infer-web.py"
          test -f "$MP/RVC WebUI.app/Contents/Resources/icon.icns"
          codesign --verify --deep --strict "$MP/RVC WebUI.app"
          grep -q "^VERSION=\"$VERSION\"" "$MP/RVC WebUI.app/Contents/MacOS/RVCWebUI"
          echo "bundle ok"

      # Catches broken Homebrew formulas and launcher regressions before a tag
      # exists: dry-run installs the declared dependencies, copies the sources
      # and stops before pip.
      - name: First-launch dry run
        if: github.event_name == 'pull_request'
        env:
          RVC_NO_TERMINAL: "1"
          RVC_DRY_RUN: "1"
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          MP=$(hdiutil attach "dist/RVC-WebUI-$VERSION-macos.dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          trap 'hdiutil detach "$MP" -quiet' EXIT
          "$MP/RVC WebUI.app/Contents/MacOS/RVCWebUI"

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/RVC-WebUI-*-macos.dmg
            dist/RVC-WebUI-*-macos.dmg.sha256
