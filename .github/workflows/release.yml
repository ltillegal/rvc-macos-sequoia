name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the .dmg to (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Launcher syntax
        run: bash -n packaging/launcher.sh

      - name: Build .dmg
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          bash packaging/build-dmg.sh --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test the bundle
        run: |
          hdiutil verify "dist/RVC-WebUI-${{ steps.build.outputs.version }}-macos.dmg" | tail -1
          MP=$(hdiutil attach "dist/RVC-WebUI-${{ steps.build.outputs.version }}-macos.dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          trap 'hdiutil detach "$MP" -quiet' EXIT
          test -x "$MP/RVC WebUI.app/Contents/MacOS/RVCWebUI"
          test -f "$MP/RVC WebUI.app/Contents/Resources/app/infer-web.py"
          test -f "$MP/RVC WebUI.app/Contents/Resources/icon.icns"
          codesign --verify --deep --strict "$MP/RVC WebUI.app"
          grep -q "^VERSION=\"${{ steps.build.outputs.version }}\"" "$MP/RVC WebUI.app/Contents/MacOS/RVCWebUI"
          echo "bundle ok"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/RVC-WebUI-*-macos.dmg
            dist/RVC-WebUI-*-macos.dmg.sha256
