name: lint

# Cheap always-on checks. They need no macOS runner and no heavy dependencies,
# so a broken commit is caught in seconds instead of after a 30-minute install.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: cheap checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for CJK text
        run: python3 tools/check_cjk.py

      - name: Python syntax and warnings
        run: |
          set -euo pipefail
          git ls-files -z '*.py' | xargs -0 -r python3 -W error::SyntaxWarning -m py_compile

      - name: Shell syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name '*.command' \) \
            -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n

      - name: YAML and JSON
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          import yaml

          problems = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix in {'.yaml', '.yml'}:
                  try:
                      yaml.safe_load(path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      problems.append(f'{path}: {exc}')
              elif path.suffix == '.json':
                  try:
                      json.loads(path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      problems.append(f'{path}: {exc}')

          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          print('YAML/JSON ok')
          PY

      - name: Dependency and documentation guards
        run: |
          set -euo pipefail
          URL='https://www.paypal.com/ncp/payment/MAMKZM5TTVN5U?locale.x=en_US&country.x=US'
          grep -qF "$URL" README.md
          grep -qF "$URL" .github/FUNDING.yml
          if grep -RInE 'https://www\.paypal\.com/ncp/payment/MAMKZM5TTVN5U([^?]|$)' \
              --exclude-dir=.git .; then
            echo 'plain PayPal URL found' >&2
            exit 1
          fi
          if grep -RInF 'poetry install' docs README.md README.ru.md; then
            echo 'stale Poetry installation instructions found' >&2
            exit 1
          fi
          echo 'dependency and documentation guards ok'

      - name: Installer unit tests
        run: python3 -m unittest tests.test_installer_isolated -v
